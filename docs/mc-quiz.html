<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>である 文法測驗｜正式書面表現</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans JP', 'Noto Sans TC', 'Montserrat', sans-serif;
        }
        /* ✨ REFINED: Premium Japanese Washi Paper Background (subtle grain + soft wave pattern) */
        body {
            background-color: #FFF8E1; 
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path fill="%23FFC2D125" d="M0 50 C20 30, 40 30, 50 50 C60 70, 80 70, 100 50 L100 100 L0 100 Z"/></svg>');
            background-blend-mode: overlay;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #263238; /* Deep soft navy (Japanese ink - refined darker tone) */
            line-height: 1.5;
        }
        /* ✨ REFINED: Premium Quiz Container (Elegant Washi Box Style) */
        .quiz-shell {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 0 1.2rem;
        }
        .quiz-meta {
            margin-bottom: 1.4rem;
            padding: 1.4rem 1.6rem;
            border-radius: 24px;
            background: rgba(238, 235, 255, 0.92);
            border: 1px solid #d8d4ff;
            box-shadow: 0 14px 40px rgba(79, 84, 227, 0.08);
        }
        .stage-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #5c6bc0;
            color: #fff;
            padding: 0.55rem 1rem;
            border-radius: 999px;
            font-weight: 700;
            letter-spacing: 0.03em;
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }
        .stage-title {
            font-size: 1.9rem;
            color: #263238;
            margin-bottom: 0.55rem;
            letter-spacing: 0.01em;
        }
        .stage-copy {
            color: #4a4a4a;
            line-height: 1.8;
            font-size: 1.03rem;
            margin: 0;
        }
        .grammar-intro {
            max-width: 680px;
            margin: 0 auto 26px;
            padding: 24px 28px;
            border-radius: 22px;
            background: rgba(255, 242, 235, 0.92);
            border: 1px solid #FFE0B2;
            box-shadow: 0 10px 25px rgba(255, 160, 119, 0.12);
        }
        .grammar-intro h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #263238;
        }
        .grammar-intro p {
            color: #4a4a4a;
            line-height: 1.75;
            margin-bottom: 0.65rem;
        }
        .grammar-tagline {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #ffe7d9;
            color: #d84315;
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            font-weight: 700;
            margin-top: 0.75rem;
            border: 1px solid #ffd0b2;
        }
        .quiz-container {
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,241,255,0.95));
            width: 100%;
            max-width: 680px;
            border-radius: 28px; /* Rounded softer corners */
            padding: 35px 32px;
            box-shadow: 0 18px 45px rgba(45,64,89,0.12), 0 0 0 6px rgba(255,194,209,0.18);
            border: 1px solid rgba(255,194,209,0.6); /* Muted Sakura Pink */
            animation: fadeIn 0.9s ease-in-out 0.1s both; /* Delayed smooth fade */
            position: relative;
            overflow: hidden;
            background-clip: padding-box;
        }
        .progress-meter {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.55);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 14px;
            box-shadow: inset 0 0 0 1px rgba(63,81,181,0.08);
        }
        .progress-meter-fill {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, #5c6bc0, #3f51b5);
            border-radius: 999px;
            transition: width 0.45s ease;
        }
        .score {
            text-align: right;
            font-size: 18px;
            font-weight: 600;
            color: #3f51b5;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
        }
        .question {
            font-size: 22px;
            margin-bottom: 28px;
            line-height: 1.7;
            text-align: left;
            font-weight: 700;
            color: #263238;
            animation: fadeIn 0.6s ease 0.2s both;
            letter-spacing: 0.02em;
        }
        .answers {
            display: grid;
            gap: 14px;
            margin-bottom: 22px;
        }
        .answer-btn {
            background: #ffffff;
            border: 2px solid rgba(99, 92, 190, 0.16);
            border-radius: 18px;
            padding: 18px 22px;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.32s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-align: left;
            color: #2b2b2b;
            letter-spacing: 0.02em;
            box-shadow: 0 10px 20px rgba(79, 84, 227, 0.06);
        }
        .answer-btn:hover {
            transform: translateY(-2px);
            background: #f3f1ff;
            border-color: #5c6bc0;
            box-shadow: 0 14px 20px rgba(79, 84, 227, 0.12);
            outline: none;
        }
        .answer-btn.correct {
            background: #66bb6a;
            color: white;
            border-color: #4caf50;
            box-shadow: 0 0 18px rgba(102, 187, 106, 0.28);
            animation: correctFlash 0.6s ease both;
        }
        .answer-btn.incorrect {
            background: #ec407a;
            color: white;
            border-color: #d81b60;
            box-shadow: 0 0 18px rgba(236, 64, 122, 0.28);
            animation: wrongFlash 0.6s ease both;
        }
        .progress {
            text-align: center;
            font-size: 15px;
            color: #5c6bc0;
            margin-top: 16px;
            font-weight: 600;
            opacity: 0.95;
        }
        .result {
            text-align: center;
            padding: 25px 15px 20px;
            animation: fadeIn 0.9s ease both;
            position: relative;
        }
        .restart-btn {
            background: linear-gradient(120deg, #66bb6a, #4caf50);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 18px 40px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-weight: 600;
            box-shadow: 0 6px 12px rgba(102, 187, 106, 0.2);
            letter-spacing: 0.5px;
        }
        .restart-btn:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 18px rgba(76, 175, 80, 0.3);
            filter: brightness(1.03);
        }
        @media (max-width: 480px) {
            .quiz-container { padding: 28px 20px; max-width: 95%; }
            .stage-title { font-size: 1.6rem; }
            .question { font-size: 20px; margin-bottom: 22px; }
            .answer-btn { font-size: 16px; padding: 16px 18px; }
            .result h2 { font-size: 28px; }
            .result .rank { font-size: 18px; }
            .result p { font-size: 19px; }
            .restart-btn { padding: 15px 30px; font-size: 18px; }
        }
    </style>
</head>
<body>
<nav>
    <div class="nav-logo">
        <i class="fas fa-book-open"></i>
        <span>日語</span> 學習與故事
    </div>
    <ul class="nav-links">
        <li><a href="./index.html">首頁</a></li>
        <li><a href="./adventure.html">東京冒險</a></li>
        <li><a href="./mc-quiz.html">測驗</a></li>
    </ul>
    <a href="#" class="gamification-hub"><i class="fas fa-trophy"></i> 我的獎勵</a>
</nav>
<main class="max-w-6xl mx-auto" style="padding: 1rem 5%;">
    <div class="grammar-intro">
        <h1>である 文法測驗</h1>
        <p>本測驗專注於「である」在正式書面與口語文本中的用法。掌握這個助動詞，能讓你的日語表達更成熟、嚴謹且具備報告風格。</p>
        <p>發音：<strong>de aru</strong>。使用情境：學術報告、文章敘述、新聞說明。</p>
        <div class="grammar-tagline">正式語氣 / 敘述句 / 書面用法</div>
    </div>
    <div class="quiz-shell">
        <div class="quiz-meta">
            <div class="stage-pill">精緻關卡</div>
            <h2 class="stage-title">挑戰你的「である」語感</h2>
            <p class="stage-copy">關卡設計已更精緻化，保留原始文化句子內容不變，讓你專注於正式書面表現。</p>
        </div>
        <div class="quiz-container" id="quiz">
            <div class="score" id="score">Score: 0 / 10</div>
            <div class="question" id="question"></div>
            <div class="answers" id="answers"></div>
            <div class="progress-meter"><div class="progress-meter-fill" id="progressFill"></div></div>
            <div class="progress" id="progress">Question 1 / 10</div>
        </div>
    </div>
    <script>
        // 🇯🇵 SUPER EASY JAPANESE VOCAB MCQs (ABSOLUTE BEGINNER - NO GRAMMAR)
        const quizQuestions = [
            {
                question: "1) What does 「こんにちは」 (konnichiwa) mean?",
                answers: [
                    { text: "Goodbye 👋", correct: false },
                    { text: "Hello / Good afternoon 👋", correct: true },
                    { text: "Thank you 🙏", correct: false },
                    { text: "Good night 🌙", correct: false }
                ]
            },
            {
                question: "2) What is the Japanese word for water (水)?",
                answers: [
                    { text: "みず (mizu) 💧", correct: true },
                    { text: "おちゃ (ocha) ☕", correct: false },
                    { text: "ジュース (juusu) 🧃", correct: false },
                    { text: "コーヒー (koohii) ☕", correct: false }
                ]
            },
            {
                question: "3) What does 「ありがとう」 (arigatou) mean?",
                answers: [
                    { text: "Sorry 😥", correct: false },
                    { text: "Thank you 🙏", correct: true },
                    { text: "Hello 👋", correct: false },
                    { text: "Yes ✔️", correct: false }
                ]
            },
            {
                question: "4) What is the meaning of 「おいしい」 (oishii)?",
                answers: [
                    { text: "Expensive 💰", correct: false },
                    { text: "Cute 🥰", correct: false },
                    { text: "Delicious 😋", correct: true },
                    { text: "Cold ❄️", correct: false }
                ]
            },
            {
                question: "5) What does 「はい」 (hai) mean?",
                answers: [
                    { text: "Yes ✔️", correct: true },
                    { text: "No ❌", correct: false },
                    { text: "Maybe 🤔", correct: false },
                    { text: "Okay ✅", correct: false }
                ]
            },
            {
                question: "6) What is the Japanese word for house (いえ / ie)?",
                answers: [
                    { text: "School 🏫", correct: false },
                    { text: "House / Home 🏠", correct: true },
                    { text: "Park 🌳", correct: false },
                    { text: "Shop 🛒", correct: false }
                ]
            },
            {
                question: "7) What does 「さようなら」 (sayounara) mean?",
                answers: [
                    { text: "Goodbye 👋", correct: true },
                    { text: "Good morning ☀️", correct: false },
                    { text: "Good night 🌙", correct: false },
                    { text: "Excuse me 🙇", correct: false }
                ]
            },
            {
                question: "8) What is the meaning of 「たべもの」 (tabemono)?",
                answers: [
                    { text: "Drink 🧃", correct: false },
                    { text: "Food 🍱", correct: true },
                    { text: "Toys 🧸", correct: false },
                    { text: "Books 📚", correct: false }
                ]
            },
            {
                question: "9) What does 「おはよう」 (ohayou) mean?",
                answers: [
                    { text: "Good morning ☀️", correct: true },
                    { text: "Good afternoon ☀️", correct: false },
                    { text: "Good night 🌙", correct: false },
                    { text: "Thank you 🙏", correct: false }
                ]
            },
            {
                question: "10) What does 「いいえ」 (iie) mean?",
                answers: [
                    { text: "Yes ✔️", correct: false },
                    { text: "No ❌", correct: true },
                    { text: "Okay ✅", correct: false },
                    { text: "Sorry 😥", correct: false }
                ]
            }
        ];
        // Global Variables
        const quizContainer = document.getElementById('quiz');
        const questionElement = document.getElementById('question');
        const answersElement = document.getElementById('answers');
        const scoreElement = document.getElementById('score');
        const progressElement = document.getElementById('progress');
        const progressBarFill = document.getElementById('progressFill');
        let currentQuestionIndex = 0;
        let score = 0;
        // Start Quiz
        startQuiz();
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            scoreElement.textContent = `Score: ${score} / 10`;
            showQuestion(quizQuestions[currentQuestionIndex]);
        }
        // Show Current Question
        function showQuestion(question) {
            resetAnswers();
            questionElement.textContent = question.question;
            progressElement.textContent = `Question ${currentQuestionIndex + 1} / 10`;
            progressBarFill.style.width = `${((currentQuestionIndex + 1) / quizQuestions.length) * 100}%`;
            question.answers.forEach(answer => {
                const button = document.createElement('button');
                button.classList.add('answer-btn');
                button.textContent = answer.text;
                button.dataset.correct = answer.correct;
                button.addEventListener('click', selectAnswer);
                answersElement.appendChild(button);
            });
        }
        // Reset Answer Buttons
        function resetAnswers() {
            while (answersElement.firstChild) answersElement.removeChild(answersElement.firstChild);
        }
        // ✨ Select Answer (Smoother Feedback, No Glitches)
        function selectAnswer(e) {
            const selectedBtn = e.target;
            const isCorrect = selectedBtn.dataset.correct === "true";
            
            if (isCorrect) {
                selectedBtn.classList.add('correct');
                score++;
                scoreElement.textContent = `Score: ${score} / 10`;
            } else {
                selectedBtn.classList.add('incorrect');
                // Highlight correct answer for learning
                document.querySelectorAll('.answer-btn').forEach(btn => {
                    if (btn.dataset.correct === "true") btn.classList.add('correct');
                });
            }
            // Disable buttons with smooth state
            document.querySelectorAll('.answer-btn').forEach(btn => {
                btn.disabled = true;
                btn.style.cursor = 'not-allowed';
            });
            // Auto next question (1s delay - perfect for animation finish)
            setTimeout(() => {
                currentQuestionIndex++;
                currentQuestionIndex < quizQuestions.length ? showQuestion(quizQuestions[currentQuestionIndex]) : showResult();
            }, 1000);
        }
        // ✅ 🌟 SUPER FUN + REFINED RESULT PAGE (FUNNY + CUTE + ENCOURAGING) 🌟✅
        function showResult() {
            resetAnswers();
            const scorePercent = (score / quizQuestions.length) * 100;
            let titleMsg = "", rankMsg = "", subMsg = "";
            // 🎊 TIER 1: PERFECT SCORE (10/10) → S-RANK + SUPER CELEBRATION
            if (scorePercent === 100) {
                titleMsg = "🌸 完璧！満点！(Kanpeki! Manten!) 🌸";
                rankMsg = "✨ S-RANK | Perfect Score! 🎊";
                subMsg = `You're a Japanese Vocab Star! 🇯🇵 ${score} / 10 (${scorePercent}%)`;
            }
            // 🍡 TIER 2: EXCELLENT (80-99%) → A-RANK + HAPPY MESSAGE
            else if (scorePercent >= 80) {
                titleMsg = "🍵 すごい！めちゃ上手！(Sugoi! Mecha Jouzu!) 🍵";
                rankMsg = "⭐ A-RANK | Excellent Work! ✨";
                subMsg = `Almost Perfect! Keep shining! ✨ ${score} / 10 (${scorePercent}%)`;
            }
            // 🌸 TIER 3: GOOD (60-79%) → B-RANK + NICE MESSAGE
            else if (scorePercent >= 60) {
                titleMsg = "✨ よくがんばりました！(Yoku Ganbatta!) ✨";
                rankMsg = "🌸 B-RANK | Great Job! 👍";
                subMsg = `You're learning so well! Keep it up! 📚 ${score} / 10 (${scorePercent}%)`;
            }
            // 💪 TIER 4: KEEP LEARNING (0-59%) → C-RANK + FUNNY ENCOURAGING MESSAGE
            else {
                titleMsg = "💪 がんばろう！がんばれ！(Ganbarou! Ganbare!) 💪";
                rankMsg = "🍡 C-RANK | Keep Practicing! 😊";
                subMsg = `Every mistake is a step to success! 📖 ${score} / 10 (${scorePercent}%)`;
            }
            // ✨ RENDER THE BEAUTIFUL FUN RESULT PAGE
            quizContainer.innerHTML = `
                <div class="result">
                    <h2>${titleMsg}</h2>
                    <div class="rank">${rankMsg}</div>
                    <p>${subMsg}</p>
                    <button class="restart-btn" onclick="startQuiz()">🔄 Retry Quiz</button>
                </div>
            `;
            createConfetti(); // 🎉 SUPER FESTIVE CONFETTI CELEBRATION!
        }
        // ✅ 🌟 SUPER FESTIVE CONFETTI (180 PIECES + MIXED SHAPES/COLORS) 🌟✅
        function createConfetti() {
            const colors = ['#FFC2D1', '#66BB6A', '#263238', '#FFF8E1', '#EC407A', '#FFE0B2'];
            for (let i = 0; i < 180; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = `${Math.random() * 100}%`;
                confetti.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
                confetti.style.setProperty('--size', `${Math.random() * 8}px`);
                confetti.style.setProperty('--radius', Math.random() > 0.5 ? '50%' : '15%');
                confetti.style.animationDelay = `${Math.random() * 4}s`;
                quizContainer.appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }
        // ✨ Confetti Fall Animation (Slow, Smooth, Natural)
        const style = document.createElement('style');
        style.textContent = `
            @keyframes confettiFall {
                0% { transform: translateY(-15px) rotate(0deg); opacity: 1; }
                100% { transform: translateY(380px) rotate(360deg); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</main>
